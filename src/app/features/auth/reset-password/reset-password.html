<div class="login-page">
  <div class="login-card">

    <img src="img/logo.png" alt="Renty" class="logo-img">
    <h2>Réinitialiser le mot de passe</h2>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">

      <div class="field">
        <label for="password">Nouveau mot de passe</label>
        <input id="password" type="password" formControlName="password">
        @if (resetForm.get('password')?.touched && resetForm.get('password')?.invalid) {
          <span class="error-text">6 caractères minimum</span>
        }
      </div>

      <div class="field">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword">
        @if (resetForm.errors?.['mismatch'] && resetForm.get('confirmPassword')?.touched) {
          <span class="error-text">Les mots de passe ne correspondent pas</span>
        }
      </div>

      <button class="btn" type="submit" [disabled]="loading">
        {{ loading ? 'Mise à jour...' : 'Réinitialiser' }}
      </button>

    </form>

    <div class="create-account">
      <a routerLink="/login">Retour à la connexion</a>
    </div>

  </div>
</div>
