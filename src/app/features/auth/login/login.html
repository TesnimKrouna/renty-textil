<div class="login-page">
  <div class="login-card">

    <img src="img/logo.png" alt="Renty" class="logo-img">
    <h2>Connexion</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email">
        @if (loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
          <span class="error-text">Email invalide</span>
        }
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password">
        @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
          <span class="error-text">6 caractères minimum</span>
        }
      </div>

      <div class="forgot">
        <a routerLink="/forgot-password">Mot de passe oublié ?</a>
      </div>

      @if (errorMessage) {
        <div class="error-text" style="text-align:center; margin-bottom:12px;">{{ errorMessage }}</div>
      }

      <button class="btn" type="submit" [disabled]="loading">
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>

    </form>

    

  </div>
</div>
